name: KasabaHub
version: 1.6.2
main: tr.kasaba.hub.KasabaHub
api-version: '1.21.10'
author: Kasaba
description: Kasaba oyun merkezi, yerleşik sayfalar, ortak lobi ve arkadaş grupları.
depend: [KasabaAuth]
softdepend: [KasabaRoles]
commands:
  oyunceza:
    description: Kalan oyun cezalarını gör; yönetici cezayı kaldırabilir.
    usage: /oyunceza veya /oyunceza kaldır Oyuncu [oyun]
  rehber:
    aliases: [bilgi]
    description: Kasaba oyunlarının bilgi kitabını aç.
    usage: /rehber
  merkez:
    description: Oyun merkezini açar ve yönetir.
    usage: /merkez yardım
  oyunlar:
    description: Oyun seçme sayfası.
    usage: /oyunlar yardım
  grup:
    description: Arkadaş grubunu yönet.
    usage: /grup yardım
  lobi:
    description: Ana lobiye dön.
    usage: /lobi
permissions:
  kasabahub.kullan:
    default: true
    description: Merkez sayfaları, lobi ve grup kullanımı.
  kasabahub.yonet:
    default: op
    description: Oyun girişlerini yönetme, lobi ayarlama ve açıkça etkinleştirilen düzenleme modu.
