name: KasabaIspanya
version: 0.7.0
main: tr.kasabatr.ispanya.KasabaIspanyaPlugin
api-version: '1.21.10'
author: KasabaTR
description: Ispanya Adasi iki zarli arena yarisi
depend: [KasabaHub, KasabaAuth]
loadbefore: [Multiverse-Core]
commands:
  ispanya:
    aliases: [sansyolu, şansyolu, sans]
    description: Ispanya Adasi oyun komutlari
    usage: /ispanya [olustur|katil|odalar|baslat|zar|cik]
permissions:
  kasabatr.ispanya.admin:
    description: Ispanya oyunu yonetimi
    default: op
